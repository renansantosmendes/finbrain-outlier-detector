name: 02 - Train Model

on:
  workflow_dispatch:
    inputs:
      tickers:
        description: "Comma-separated symbols, for example AAPL,PETR4.SA"
        required: true
        default: "AAPL"
        type: string
      start:
        description: "First date of the price history, in YYYY-MM-DD"
        required: true
        default: "2020-01-01"
        type: string
      contamination:
        description: "Expected share of outliers in each training window"
        required: true
        default: 0.1
        type: number
      random_seed:
        description: "Seed of the Isolation Forest"
        required: true
        default: 42
        type: number

permissions:
  contents: read

concurrency:
  group: train-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci-check:
    name: Check that CI passed for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Wait for the CI run of this commit
        run: |
          for attempt in $(seq 1 60); do
            successful_runs=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --commit "$GITHUB_SHA" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq 'length')
            if [ "$successful_runs" -ge 1 ]; then
              echo "CI passed for commit $GITHUB_SHA."
              exit 0
            fi
            total_runs=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --commit "$GITHUB_SHA" \
              --json databaseId \
              --jq 'length')
            pending_runs=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow ci.yml \
              --commit "$GITHUB_SHA" \
              --json status \
              --jq '[.[] | select(.status != "completed")] | length')
            if [ "$pending_runs" -eq 0 ] && [ "$total_runs" -gt 0 ]; then
              echo "The CI runs of commit $GITHUB_SHA finished without success."
              exit 1
            fi
            if [ "$pending_runs" -eq 0 ] && [ "$attempt" -ge 6 ]; then
              echo "No CI run was found for commit $GITHUB_SHA after 3 minutes."
              exit 1
            fi
            echo "Waiting for the CI of commit $GITHUB_SHA (attempt $attempt of 60)."
            sleep 30
          done
          echo "Timed out waiting for the CI of commit $GITHUB_SHA."
          exit 1

  plan:
    name: Check the tickers and the W&B key
    needs: ci-check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    outputs:
      tickers_csv: ${{ steps.parse.outputs.tickers_csv }}

    env:
      TICKERS_INPUT: ${{ inputs.tickers }}
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}

    steps:
      - name: Parse and validate the ticker list
        id: parse
        run: |
          invalid=$(printf '%s' "$TICKERS_INPUT" | tr ',' '\n' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | grep -v '^$' \
            | grep -E -v '^[A-Za-z0-9._^=-]+$' || true)
          if [ -n "$invalid" ]; then
            echo "Invalid ticker symbols:"
            echo "$invalid"
            exit 1
          fi

          tickers_csv=$(printf '%s' "$TICKERS_INPUT" | tr ',' '\n' \
            | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' \
            | grep -v '^$' \
            | paste -sd, -)
          if [ -z "$tickers_csv" ]; then
            echo "No ticker symbol was given."
            exit 1
          fi
          echo "tickers_csv=$tickers_csv" >> "$GITHUB_OUTPUT"
          echo "Tickers to train: $tickers_csv"

      - name: Require a W&B API key
        run: |
          if [ -z "$WANDB_API_KEY" ]; then
            echo "A W&B API key is required: set the WANDB_API_KEY secret."
            exit 1
          fi
          echo "A W&B API key was found."

  train:
    name: Train and register the detectors in W&B
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TICKERS: ${{ needs.plan.outputs.tickers_csv }}
      START: ${{ inputs.start }}
      CONTAMINATION: ${{ inputs.contamination }}
      RANDOM_SEED: ${{ inputs.random_seed }}
      WANDB_API_KEY: ${{ secrets.WANDB_API_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Hide the W&B API key from the logs
        run: echo "::add-mask::$WANDB_API_KEY"

      - name: Set up Python and uv
        uses: ./.github/actions/setup-python-uv

      - name: Train one detector per ticker and register it
        run: >
          uv run python -m outlier_detector.training.train
          --tickers "$TICKERS"
          --start "$START"
          --contamination "$CONTAMINATION"
          --random-seed "$RANDOM_SEED"
          --wandb-project outlier-detector
