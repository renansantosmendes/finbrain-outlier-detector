[project]
name = "outlier-detector"
version = "0.1.0"
description = "Train and serve an Isolation Forest that flags atypical market days"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "joblib",
    "yfinance>=1.7.0",
    "fastapi",
    "uvicorn[standard]",
    "pydantic",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "pylint",
    "httpx",
]
notebook = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.10.9",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.format]
max-line-length = 79

[tool.pylint.design]
min-public-methods = 1
